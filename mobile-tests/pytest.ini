[pytest]
addopts = -ra --strict-markers --timeout=180 --timeout-method=signal
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    authentication: Authentication module
    authorization: Authorization module
    camera: Camera / Upload module
    advisory_profile: Advisory / Profile management module
    navigation: Navigation module
    dashboard: Dashboard module
    forms: Forms module
    crud: CRUD operations module
    input_validation: Input validation module
    error_handling: Error handling module
    session: Session management module
    notifications: Notifications module
    offline: Offline handling module
    accessibility: Accessibility module
    responsive: Responsive UI module
    smoke: Fast smoke subset
    p1: Priority 1 (critical)
    p2: Priority 2 (high)
    p3: Priority 3 (medium)
    p4: Priority 4 (low)

filterwarnings =
    ignore::DeprecationWarning
