[pytest]
addopts = 
    --html=reports/execution-report.html
    --self-contained-html
    --reruns=2
    --reruns-delay=3
    --timeout=60
    -v
    --tb=short

testpaths = tests
log_cli = true
log_cli_level = INFO
log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    authentication: Authentication test cases
    authorization: Authorization test cases
    navigation: Navigation test cases
    ui_validation: UI validation test cases
    forms: Form test cases
    crud: CRUD operation test cases
    input_validation: Input validation test cases
    error_handling: Error handling test cases
    session_management: Session management test cases
    accessibility: Accessibility test cases
    responsive: Responsive design test cases
    smoke: Smoke tests (quick sanity checks)
    regression: Full regression suite
    high: High priority
    medium: Medium priority
    low: Low priority
