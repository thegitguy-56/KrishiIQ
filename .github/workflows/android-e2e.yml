name: Android E2E (Appium / Flutter)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.27.1"
  APK_PATH: mobile/build/app/outputs/flutter-apk/app-debug.apk
  APP_PACKAGE: com.krishiiq.krishiiq

jobs:
  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    outputs:
      apk-artifact: krishiiq-test-apk
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK with Flutter Driver extension enabled
        working-directory: mobile
        run: flutter build apk --debug -t lib/main_test.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: krishiiq-test-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

  mobile-e2e:
    name: Run Appium suite (shard ${{ matrix.shard }}/8)
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: krishiiq-test-apk
          path: mobile/build/app/outputs/flutter-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python test dependencies
        working-directory: mobile-tests
        run: pip install -r requirements.txt

      - name: Install backend runtime dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start FastAPI backend (ephemeral SQLite, auto-seeded)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          SECRET_KEY: ${{ secrets.CI_TEST_JWT_SECRET || 'ci-ephemeral-secret-do-not-reuse' }}
          REDIS_URL: ""
          ENVIRONMENT: "development"
          CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
        run: |
          # Bound to 0.0.0.0 (not just 127.0.0.1) and on port 8001 specifically —
          # mobile/lib/config/app_config.dart hardcodes the app's API base URL to
          # http://10.0.2.2:8001, which is the Android emulator's fixed alias for
          # the host machine's loopback interface. Port 8000 (used by
          # backend-tests.yml) would NOT match what's baked into the built APK.
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8001 > ../backend-server.log 2>&1 &
          echo $! > ../backend-server.pid

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become healthy within 60s."
          cat backend-server.log || true
          exit 1

      - name: Set up Node.js (for Appium server)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium + Flutter driver plugin
        run: |
          npm install -g appium@3
          appium driver install --source=npm appium-flutter-driver
          appium driver list --installed

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK exists
        run: |
          test -f "${{ env.APK_PATH }}" || { echo "::error::APK not found at ${{ env.APK_PATH }}"; exit 1; }

      - name: Run tests on Android emulator (AVD cached across runs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: chmod +x mobile-tests/scripts/ci_run_shard.sh && mobile-tests/scripts/ci_run_shard.sh "${{ matrix.shard }}" "${{ env.APK_PATH }}" "${{ env.APP_PACKAGE }}"
        continue-on-error: true

      - name: Upload shard results (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-shard-${{ matrix.shard }}
          path: |
            mobile-tests/reports/execution-results-shard-*.json
            mobile-tests/reports/junit-shard-*.xml
            mobile-tests/reports/pytest-output-shard-*.log
            mobile-tests/reports/screenshots
            mobile-tests/reports/logs
            *.log
          retention-days: 30
          if-no-files-found: warn

  report:
    name: Merge results & publish reports
    needs: mobile-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install report dependencies
        run: pip install openpyxl jinja2

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-test-results-shard-*
          path: mobile-tests/reports/shards
          merge-multiple: true

      - name: Merge shard JSON reports
        working-directory: mobile-tests
        run: |
          python3 - <<'PY'
          import json, glob, os

          # actions/upload-artifact preserves each shard job's full relative
          # path (e.g. mobile-tests/reports/execution-results-shard-1.json)
          # because the per-shard upload step also globs root-level *.log
          # files, which pushes the common ancestor up to the repo root.
          # download-artifact then recreates that path *inside* our chosen
          # download dir, so the real files end up nested one level deeper
          # than a flat "reports/shards/*.json" glob expects. Recurse instead
          # of guessing the exact nesting depth.
          found = glob.glob("reports/shards/**/execution-results-shard-*.json", recursive=True)

          merged = {"tests": []}
          for f in found:
              with open(f) as fh:
                  data = json.load(fh)
              merged["tests"].extend(data.get("tests", []))

          os.makedirs("reports", exist_ok=True)
          with open("reports/execution-results.json", "w") as fh:
              json.dump(merged, fh)

          print(f"Merged {len(merged['tests'])} test results from {len(found)} shard file(s): {found}")
          PY

      - name: Generate Excel / HTML / summary reports
        working-directory: mobile-tests
        run: |
          python3 utils/report_generator.py \
            --input reports/execution-results.json \
            --outdir reports

      - name: Publish GitHub Actions summary
        if: always()
        run: |
          if [ -f mobile-tests/reports/summary.md ]; then
            cat mobile-tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Mobile E2E: no summary.md produced (check earlier steps for setup failures)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-final-report
          path: |
            mobile-tests/reports/Automation_Test_Report.xlsx
            mobile-tests/reports/execution-report.html
            mobile-tests/reports/dashboard.html
            mobile-tests/reports/execution-results.json
            mobile-tests/reports/summary.md
            mobile-tests/reports/shards/**/screenshots/**
            mobile-tests/reports/shards/**/logs/**
          retention-days: 30
          if-no-files-found: warn