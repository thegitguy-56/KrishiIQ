<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KrishiIQ</title>
    <script>
      // GitHub Pages SPA redirect trick
      // When GitHub Pages returns 404 for a client-side route,
      // this page captures the URL and redirects to index.html
      // with the path encoded as a query parameter.
      var segmentCount = 1; // 1 = repo name segment (/KrishiIQ/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
